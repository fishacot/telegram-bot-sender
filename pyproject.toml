[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-broadcast-mvp"
version = "0.1.0"
description = "Safe Telegram broadcast platform MVP with session accounts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7.0",
    "telethon>=1.36.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "pydantic-settings>=2.3.4",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "python-json-logger>=2.0.7",
    "httpx>=0.27.0",
    "aiohttp-socks>=0.10.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
